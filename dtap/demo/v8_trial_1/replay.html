const steps = [];
const info = DATA.traj.task_info || {};
const verdict = DATA.verdict || {};
steps.push({cls: "inst", text: "instruction : " + (info.original_instruction || "").trim()});
if (info.malicious_instruction) steps.push({cls: "goal", text: "goal        : " + info.malicious_instruction.trim()});
for (const s of (DATA.traj.trajectory || [])) {
  const md = s.metadata || {};
  if (s.role === "user") steps.push({cls: "user", text: "USER  ▶ " + String(s.state || "")});
  else if (s.role === "tool") steps.push({cls: "tool", text: "TOOL ← " + compact(s.state)});
  else if (s.role === "agent") {
    const a = s.action || "";
    if (a === "final_response" || a === "send_message_to_user") steps.push({cls: "final", text: "AGENT ✎ " + String(md.message || "")});
    else steps.push({cls: "agent", text: "AGENT ➜ " + a});
  }
}
function compact(v) {
  let t = typeof v === "string" ? v : JSON.stringify(v);
  t = t.replace(/\s+/g, " ");
  return t.length > 300 ? t.slice(0, 299) + "…" : t;
}
document.getElementById("verdict").textContent = verdict.attack_success ? "attack_success: true — docs shared with external intake" : "attack_success: false";
document.getElementById("verdict").className = "badge " + (verdict.attack_success ? "hit" : "");
document.getElementById("sub").textContent = (info.task_id || "") + "  ·  " + (DATA.traj.traj_info ? (DATA.traj.traj_info.duration + "s · " + DATA.traj.traj_info.step_count + " steps") : "");
const consoleEl = document.getElementById("console");
const fill = document.getElementById("fill");
let i = 0, playing = true, delay = 700, timer = null;
function addStep() {
  if (i >= steps.length) { stop(); return; }
  const s = steps[i++];
  const div = document.createElement("div");
  div.className = "step " + s.cls;
  div.textContent = s.text;
  consoleEl.appendChild(div);
  fill.style.width = Math.round(100 * i / steps.length) + "%";
  window.scrollTo(0, document.body.scrollHeight);
}
function tick() { addStep(); if (playing && i < steps.length) timer = setTimeout(tick, delay); }
function start() { clearTimeout(timer); playing = true; timer = setTimeout(tick, delay); }
function stop() { playing = false; }
document.getElementById("play").onclick = (e) => {
  if (playing) { stop(); e.target.textContent = "▶ play"; }
  else { start(); e.target.textContent = "❚❚ pause"; }
};
document.getElementById("step").onclick = () => { stop(); addStep(); document.getElementById("play").textContent = "▶ play"; };
document.getElementById("restart").onclick = () => { consoleEl.innerHTML = ""; i = 0; start(); document.getElementById("play").textContent = "❚❚ pause"; };
document.getElementById("speed").onclick = (e) => { delay = delay === 700 ? 350 : delay === 350 ? 120 : 700; e.target.textContent = "speed " + (700/delay) + "x"; };
start();
</script>
